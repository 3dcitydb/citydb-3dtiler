site_name: "citydb-3dtiler"
repo_name: "3dcitydb/citydb-3dtiler"
repo_url: "https://github.com/3dcitydb/citydb-3dtiler"
site_url: "https://3dcitydb.github.io/citydb-3dtiler/"
edit_uri: "tree/main/docs"
# exclude_docs: |
#   /html_documents/
#   /notebooks/
nav:
  - "citydb-3dtiler": index.md
  - "CLI Overview": cli.md
  - "Main Options": main_options.md
  - "Database Con. Options" : db_con_options.md
  - "Filter Options" : filter_options.md
  - "advise Command" : advise.md
  - "tile Command" : tile.md
  - "Sample Commands" : samples.md
  - "citydb-3dtiler Docker": docker.md
  - "Developer Notes" : dev_notes.md
theme: 
  name: material
  logo: ./images/tiles_light.png
  favicon: ./images/tiles_light.png
  admonition:
    note: octicons/tag-16
    abstract: octicons/checklist-16
    info: octicons/info-16
    tip: octicons/squirrel-16
    success: octicons/check-16
    question: octicons/question-16
    warning: octicons/alert-16
    failure: octicons/x-circle-16
    danger: octicons/zap-16
    bug: octicons/bug-16
    example: octicons/beaker-16
    quote: octicons/quote-16
  palette: 
    # Palette toggle for light mode
    - scheme: default
      primary: green
      accent: cyan
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: green
      accent: cyan
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.tabs.link
    - content.code.copy
    - content.code.select
extra_css:
  - stylesheets/extra.css
  - extra_style.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tasklist:
      clickable_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - tags:
      tags: true
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/


